name: Supabase Migration CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/duitku-pop-edge-functions]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    name: Validate migrations on isolated local database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase db start

      - name: Apply all migrations to a clean local database
        run: supabase db reset --local

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run Requirement V1 lifecycle integration tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/requirement-v1.sql

      - name: Lint local database schema
        run: |
          set -o pipefail
          supabase db lint --local 2>&1 | tee /tmp/supabase-db-lint.log
          if grep -q '"level": "error"' /tmp/supabase-db-lint.log; then
            echo "::error::Supabase schema lint reported SQL errors."
            exit 1
          fi

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
