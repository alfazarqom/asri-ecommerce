project_id = "asri-ecommerce"

[functions.duitku-create-invoice]
# Protected by DUITKU_INTERNAL_API_SECRET because this endpoint is server-to-server.
verify_jwt = false

[functions.duitku-callback]
# Duitku authenticates callbacks with the documented HMAC signature.
verify_jwt = false

[functions.get-asri-products]
# Public catalog feed; the function uses service_role server-side and exposes read-only rows.
verify_jwt = false

[functions.create-order]
# Public guest checkout endpoint; gateway validates the Supabase anon JWT.
verify_jwt = true
