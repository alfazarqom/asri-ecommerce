name: Apply Deno Formatting

on:
  push:
    branches: [feat/duitku-pop-edge-functions]

permissions:
  contents: write

concurrency:
  group: apply-deno-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip format]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/duitku-pop-edge-functions
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format the three approved files
        run: deno fmt supabase/functions/_shared/duitku.ts supabase/functions/duitku-create-invoice/index.ts supabase/functions/duitku-callback/index.ts

      - name: Commit formatting-only changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/duitku.ts supabase/functions/duitku-create-invoice/index.ts supabase/functions/duitku-callback/index.ts
          git commit -m "style(duitku): apply Deno formatting [skip format]"
          git push origin HEAD:feat/duitku-pop-edge-functions
